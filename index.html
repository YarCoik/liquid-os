<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiquidOS</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts: Geist Mono for terminal, Outfit for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="theme-dark" id="os-body">

  <!-- ═══════════════════════════════════════════
       TOP MENU BAR (macOS-style status bar)
  ═══════════════════════════════════════════ -->
  <div id="menubar">
    <div id="menubar-left">
      <span id="apple-logo" class="menubar-btn">⌘</span>
      <span id="active-app-name">LiquidOS</span>
      <span class="menubar-menu-item" id="global-menu-file">File</span>
      <span class="menubar-menu-item" id="global-menu-edit">Edit</span>
      <span class="menubar-menu-item" id="global-menu-view">View</span>
      <span class="menubar-menu-item" id="global-menu-help">Help</span>
    </div>
    <div id="menubar-right">
      <span class="status-icon" id="status-wifi" title="Wi-Fi">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
      </span>
      <span class="status-icon" id="status-battery" title="Battery">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2"/><path d="M23 13v-2"/><rect x="3" y="8" width="12" height="8" rx="1" fill="currentColor" opacity="0.7"/></svg>
      </span>
      <span id="menubar-time"></span>
      <span id="menubar-date"></span>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       DESKTOP (wallpaper + icons)
  ═══════════════════════════════════════════ -->
  <div id="desktop">
    <!-- Desktop icons rendered by JS -->
    <div id="desktop-icons"></div>

    <!-- Drag-select rectangle -->
    <div id="drag-select-rect"></div>
  </div>

  <!-- ═══════════════════════════════════════════
       WINDOW LAYER (all windows render here)
  ═══════════════════════════════════════════ -->
  <div id="window-layer"></div>

  <!-- ═══════════════════════════════════════════
       CONTEXT MENU (right-click)
  ═══════════════════════════════════════════ -->
  <div id="context-menu" class="glass-panel hidden">
    <ul id="context-menu-list"></ul>
  </div>

  <!-- ═══════════════════════════════════════════
       DOCK (bottom bar)
  ═══════════════════════════════════════════ -->
  <div id="dock-wrapper">
    <div id="dock" class="glass-panel">
      <!-- Dock icons rendered by JS -->
      <div id="dock-icons"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       NOTIFICATION TOAST
  ═══════════════════════════════════════════ -->
  <div id="notification-container"></div>

  <!-- ═══════════════════════════════════════════
       BOOT SCREEN (shown on first load)
  ═══════════════════════════════════════════ -->
  <div id="boot-screen">
    <div id="boot-logo">
      <div id="boot-icon">⌘</div>
      <div id="boot-name">LiquidOS</div>
      <div id="boot-progress-bar"><div id="boot-progress-fill"></div></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
